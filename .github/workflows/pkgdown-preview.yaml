name: pkgdown preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "R/**"
      - "man/**"
      - "vignettes/**"
      - "inst/**"
      - "data/**"
      - "scripts/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "README.md"
      - "NEWS.md"
      - "_pkgdown.yml"
      - ".github/workflows/pkgdown-preview.yaml"

permissions:
  contents: write

concurrency:
  group: pkgdown-pages
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RTICHOKE_VIZ_VERSION: "0.7.0"
      RTICHOKE_VIZ_RELEASE_TAG: "v0.7.0"
      RTICHOKE_VIZ_SOURCE_COMMIT: "b3564d2824ec1791f791fda406c99b3d7865a68f"
      RTICHOKE_VIZ_ARCHIVE: "rtichoke-viz-0.7.0.tar.gz"
      RTICHOKE_VIZ_SHA256: "f09c30e231a8be39c2e89ba6ae39c90ed8cab67021213e17681a475066a9806e"
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          pak-version: stable

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE)'

      - name: Download rtichoke_viz browser bundle
        run: |
          BUNDLE="rtichoke-viz-${RTICHOKE_VIZ_VERSION}"
          BASE_URL="https://github.com/uriahf/rtichoke_viz/releases/download/${RTICHOKE_VIZ_RELEASE_TAG}"
          mkdir -p /tmp/rtichoke-viz
          curl -fL "${BASE_URL}/${RTICHOKE_VIZ_ARCHIVE}" \
            -o "/tmp/rtichoke-viz/${RTICHOKE_VIZ_ARCHIVE}"
          curl -fL "${BASE_URL}/${RTICHOKE_VIZ_ARCHIVE}.sha256" \
            -o "/tmp/rtichoke-viz/${RTICHOKE_VIZ_ARCHIVE}.sha256"
          cd /tmp/rtichoke-viz
          EXPECTED="$(awk '{print $1}' "${RTICHOKE_VIZ_ARCHIVE}.sha256")"
          ACTUAL="$(sha256sum "${RTICHOKE_VIZ_ARCHIVE}" | awk '{print $1}')"
          echo "rtichoke_viz release tag: ${RTICHOKE_VIZ_RELEASE_TAG}"
          echo "rtichoke_viz source commit: ${RTICHOKE_VIZ_SOURCE_COMMIT}"
          echo "rtichoke_viz archive: ${RTICHOKE_VIZ_ARCHIVE}"
          echo "rtichoke_viz archive SHA-256: ${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"
          test "${ACTUAL}" = "${RTICHOKE_VIZ_SHA256}"
          cmp "${RTICHOKE_VIZ_ARCHIVE}" \
            "${GITHUB_WORKSPACE}/inst/rtichoke-viz/${RTICHOKE_VIZ_ARCHIVE}"
          cd "${GITHUB_WORKSPACE}"
          Rscript tools/verify-rtichoke-viz.R
          cd /tmp/rtichoke-viz
          tar -xzf "${RTICHOKE_VIZ_ARCHIVE}"
          test -f "${BUNDLE}/rtichoke-viz.js"
          test -f "${BUNDLE}/rtichoke-viz.css"
          test -f "${BUNDLE}/rtichoke-viz.schema.json"
          test -f "${BUNDLE}/rtichoke-viz-v2.schema.json"
          test -f "${BUNDLE}/MANIFEST"
          grep -Fq 'https://rtichoke.dev/schema/viz/1.0.json' \
            "${BUNDLE}/rtichoke-viz.schema.json"
          grep -Fq 'https://rtichoke.dev/schema/viz/2.0.json' \
            "${BUNDLE}/rtichoke-viz-v2.schema.json"

      - name: Generate rtichoke_viz ROC proof
        run: |
          Rscript scripts/rtichoke_viz_roc_proof.R
          BUNDLE="/tmp/rtichoke-viz/rtichoke-viz-${RTICHOKE_VIZ_VERSION}"
          cp "${BUNDLE}/rtichoke-viz.js" docs/rtichoke-viz-roc/
          cp "${BUNDLE}/rtichoke-viz.css" docs/rtichoke-viz-roc/

      - name: Generate rtichoke_viz calibration proof
        run: |
          Rscript scripts/rtichoke_viz_calibration_proof.R
          BUNDLE="/tmp/rtichoke-viz/rtichoke-viz-${RTICHOKE_VIZ_VERSION}"
          cp "${BUNDLE}/rtichoke-viz.js" docs/rtichoke-viz-calibration/
          cp "${BUNDLE}/rtichoke-viz.css" docs/rtichoke-viz-calibration/

      - name: Publish PR preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: pr-preview/pr-${{ github.event.pull_request.number }}
          keep_files: true

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
      - name: Remove PR preview
        run: |
          rm -rf "pr-preview/pr-${{ github.event.pull_request.number }}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove pkgdown preview for PR #${{ github.event.pull_request.number }}"
          git push

name: pkgdown preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "R/**"
      - "man/**"
      - "vignettes/**"
      - "inst/**"
      - "data/**"
      - "scripts/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "README.md"
      - "NEWS.md"
      - "_pkgdown.yml"
      - ".github/workflows/pkgdown-preview.yaml"

permissions:
  contents: write

concurrency:
  group: pkgdown-pages
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RTICHOKE_VIZ_VERSION: "0.24.0"
      RTICHOKE_VIZ_RELEASE_TAG: "v0.24.0"
      RTICHOKE_VIZ_SOURCE_COMMIT: "9ff8c40138c7b2d11332483e0ede900d8b50b935"
      RTICHOKE_VIZ_TAG_SHA: "b535e66"
      RTICHOKE_VIZ_ARCHIVE: "rtichoke-viz-0.24.0.tar.gz"
      RTICHOKE_VIZ_SHA256: "58f153fbfb5aa57affbec983c4e4960fd0889c26e64ef1d25dbf982654fa90f0"
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          pak-version: stable

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE)'

      - name: Verify and unpack vendored rtichoke_viz browser bundle
        shell: bash
        run: |
          set -euo pipefail
          VENDOR="inst/rtichoke-viz"
          VERSION="$(sed -n 's/^version=//p' "$VENDOR/MANIFEST")"
          SOURCE_COMMIT="$(sed -n 's/^commit=//p' "$VENDOR/MANIFEST")"
          ARCHIVE="rtichoke-viz-$VERSION.tar.gz"
          CHECKSUM="$(sed -n 's/^archive_sha256: //p' "$VENDOR/PROVENANCE")"
          test -n "$VERSION"
          test -n "$SOURCE_COMMIT"
          test -n "$CHECKSUM"
          test -f "$VENDOR/$ARCHIVE"
          test "$(sha256sum "$VENDOR/$ARCHIVE" | awk '{print $1}')" = "$CHECKSUM"
          Rscript tools/verify-rtichoke-viz.R
          mkdir -p /tmp/rtichoke-viz
          cp "$VENDOR/$ARCHIVE" "/tmp/rtichoke-viz/$ARCHIVE"
          tar -xzf "/tmp/rtichoke-viz/$ARCHIVE" -C /tmp/rtichoke-viz
          BUNDLE="/tmp/rtichoke-viz/rtichoke-viz-$VERSION"
          test -f "$BUNDLE/rtichoke-viz.js"
          test -f "$BUNDLE/rtichoke-viz.css"
          test -f "$BUNDLE/rtichoke-viz.schema.json"
          test -f "$BUNDLE/rtichoke-viz-v2.schema.json"
          cmp "$VENDOR/rtichoke-viz.js" "$BUNDLE/rtichoke-viz.js"
          cmp "$VENDOR/rtichoke-viz.css" "$BUNDLE/rtichoke-viz.css"
          grep -Fq 'https://rtichoke.dev/schema/viz/1.0.json' "$BUNDLE/rtichoke-viz.schema.json"
          grep -Fq 'https://rtichoke.dev/schema/viz/2.0.json' "$BUNDLE/rtichoke-viz-v2.schema.json"
          echo "RTICHOKE_VIZ_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Vendored browser bundle: $VERSION ($SOURCE_COMMIT), SHA-256 $CHECKSUM"

      - name: Generate rtichoke_viz ROC proof
        run: |
          Rscript scripts/rtichoke_viz_roc_proof.R
          BUNDLE="/tmp/rtichoke-viz/rtichoke-viz-${RTICHOKE_VIZ_VERSION}"
          cp "${BUNDLE}/rtichoke-viz.js" docs/rtichoke-viz-roc/
          cp "${BUNDLE}/rtichoke-viz.css" docs/rtichoke-viz-roc/

      - name: Generate rtichoke_viz calibration proof
        run: |
          Rscript scripts/rtichoke_viz_calibration_proof.R
          BUNDLE="/tmp/rtichoke-viz/rtichoke-viz-${RTICHOKE_VIZ_VERSION}"
          cp "${BUNDLE}/rtichoke-viz.js" docs/rtichoke-viz-calibration/
          cp "${BUNDLE}/rtichoke-viz.css" docs/rtichoke-viz-calibration/

      - name: Publish PR preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: pr-preview/pr-${{ github.event.pull_request.number }}
          keep_files: true

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
      - name: Remove PR preview
        run: |
          rm -rf "pr-preview/pr-${{ github.event.pull_request.number }}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove pkgdown preview for PR #${{ github.event.pull_request.number }}"
          git push

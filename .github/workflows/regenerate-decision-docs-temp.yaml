name: Regenerate Decision Curve docs temporary

on:
  push:
    branches:
      - feat/static-decision-curve-browser-v2
    paths:
      - '.github/workflows/regenerate-decision-docs-temp.yaml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/static-decision-curve-browser-v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: check
          pak-version: stable
      - name: Regenerate documentation exactly like CI
        shell: Rscript {0}
        run: roxygen2::roxygenise()
      - name: Commit generated files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESCRIPTION NAMESPACE man
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Decision Curve documentation"
            git push origin HEAD:feat/static-decision-curve-browser-v2
          fi

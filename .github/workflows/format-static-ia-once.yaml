name: Format static IA once

on:
  push:
    branches:
      - feat/static-interventions-avoided-browser-v2
    paths:
      - '.github/workflows/format-static-ia-once.yaml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/static-interventions-avoided-browser-v2

      - uses: posit-dev/setup-air@v1
        with:
          version: 0.11.0

      - name: Format changed R files
        run: |
          air format R/decision.R
          air format R/helpers.R
          air format R/rtichoke_viz_v2.R
          air format tests/testthat/test-decision-browser-v2.R
          air format tests/testthat/test-interventions-avoided-browser-v2.R

      - name: Commit formatting and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-static-ia-once.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Format static Interventions Avoided adoption'
          git push origin HEAD:feat/static-interventions-avoided-browser-v2

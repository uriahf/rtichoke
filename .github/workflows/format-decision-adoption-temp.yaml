name: Format Decision Curve adoption temporary

on:
  push:
    branches:
      - feat/static-decision-curve-browser-v2
    paths:
      - '.github/workflows/format-decision-adoption-temp.yaml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/static-decision-curve-browser-v2
      - uses: posit-dev/setup-air@v1
        with:
          version: "0.11.0"
      - name: Format changed R files
        run: |
          air format R/decision.R
          air format R/rtichoke_viz_v2.R
          air format tests/testthat/test-decision-browser-v2.R
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/decision.R R/rtichoke_viz_v2.R tests/testthat/test-decision-browser-v2.R
          if ! git diff --cached --quiet; then
            git commit -m "Format Decision Curve browser adoption"
            git push origin HEAD:feat/static-decision-curve-browser-v2
          fi

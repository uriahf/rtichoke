name: air-preview
on:
  push:
    branches: [report-spec-assembler]
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: posit-dev/setup-air@v1
        with:
          version: "0.11.0"
      - run: |
          air format R/report_spec.R
          git diff -- R/report_spec.R

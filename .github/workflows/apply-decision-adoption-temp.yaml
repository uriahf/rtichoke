name: Apply Decision Curve adoption temporary

on:
  push:
    branches:
      - feat/static-decision-curve-browser-v2
    paths:
      - '.github/workflows/apply-decision-adoption-temp.yaml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/static-decision-curve-browser-v2
      - name: Apply focused patch
        run: python3 .github/apply_decision_adoption.py
      - name: Keep workflow YAML for API-managed update
        run: |
          git restore .github/workflows/pkgdown-preview.yaml
          git restore .github/workflows/quarto-browser-summary-acceptance.yaml
          git restore .github/workflows/apply-decision-adoption-temp.yaml
      - name: Commit focused adoption
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add static Decision Curve browser rendering"
          git push origin HEAD:feat/static-decision-curve-browser-v2

on:
  pull_request:
    paths:
      - "R/**"
      - "man/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - ".github/workflows/documentation.yaml"

name: documentation

permissions:
  contents: write

jobs:
  documentation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: check

      - name: Regenerate documentation
        shell: Rscript {0}
        run: roxygen2::roxygenise()

      - name: Commit regenerated documentation
        shell: bash
        run: |
          if ! git diff --quiet -- DESCRIPTION NAMESPACE man; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- DESCRIPTION NAMESPACE man
            git commit -m "Regenerate documentation"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check generated files are current
        shell: bash
        run: git diff --exit-code -- DESCRIPTION NAMESPACE man

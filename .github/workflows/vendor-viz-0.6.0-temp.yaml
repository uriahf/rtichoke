name: Vendor rtichoke_viz v0.6.0 temporary

on:
  push:
    branches:
      - feat/static-decision-curve-browser-v2
    paths:
      - '.github/workflows/vendor-viz-0.6.0-temp.yaml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/static-decision-curve-browser-v2
      - name: Vendor exact immutable release
        shell: bash
        run: |
          set -euo pipefail
          version="0.6.0"
          tag="v0.6.0"
          commit="3abb3f07a598c3e22d5362a3f88e52bb6b52b083"
          archive="rtichoke-viz-${version}.tar.gz"
          expected="625613c7f692ff50b7757a27bb6caf84e311971bde92593141393dbd897af3a2"
          base="https://github.com/uriahf/rtichoke_viz/releases/download/${tag}"
          curl -fL --retry 3 -o "/tmp/${archive}" "${base}/${archive}"
          curl -fL --retry 3 -o "/tmp/${archive}.sha256" "${base}/${archive}.sha256"
          grep -F "${expected}  ${archive}" "/tmp/${archive}.sha256"
          actual="$(sha256sum "/tmp/${archive}" | awk '{print $1}')"
          test "${actual}" = "${expected}"
          rm -rf /tmp/rtichoke-viz-release
          mkdir -p /tmp/rtichoke-viz-release
          tar -xzf "/tmp/${archive}" -C /tmp/rtichoke-viz-release
          root="/tmp/rtichoke-viz-release/rtichoke-viz-${version}"
          grep -Fx "version=${version}" "${root}/MANIFEST"
          grep -Fx "commit=${commit}" "${root}/MANIFEST"
          for name in MANIFEST rtichoke-viz.js rtichoke-viz.css rtichoke-viz.schema.json rtichoke-viz-v2.schema.json; do
            test -f "${root}/${name}"
          done
          rm -f inst/rtichoke-viz/rtichoke-viz-*.tar.gz
          cp "/tmp/${archive}" "inst/rtichoke-viz/${archive}"
          cp "${root}/MANIFEST" inst/rtichoke-viz/MANIFEST
          cp "${root}/rtichoke-viz.js" inst/rtichoke-viz/rtichoke-viz.js
          cp "${root}/rtichoke-viz.css" inst/rtichoke-viz/rtichoke-viz.css
          cp "${root}/rtichoke-viz.schema.json" inst/rtichoke-viz/rtichoke-viz.schema.json
          cp "${root}/rtichoke-viz-v2.schema.json" inst/rtichoke-viz/rtichoke-viz-v2.schema.json
          cat > inst/rtichoke-viz/PROVENANCE <<EOF
          release=https://github.com/uriahf/rtichoke_viz/releases/tag/${tag}
          version=${version}
          commit=${commit}
          archive=${archive}
          sha256=${expected}
          EOF
          rm .github/workflows/vendor-viz-0.6.0-temp.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inst/rtichoke-viz .github/workflows/vendor-viz-0.6.0-temp.yaml
          git commit -m "Vendor immutable rtichoke_viz v0.6.0"
          git push origin HEAD:feat/static-decision-curve-browser-v2

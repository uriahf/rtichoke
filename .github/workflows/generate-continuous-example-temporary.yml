name: Generate continuous example dataset (one-time)
on:
  push:
    branches:
      - docs/reproducible-continuous-steps-example
    paths:
      - .github/workflows/generate-continuous-example-temporary.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::usethis, any::roxygen2
          needs: documentation
      - name: Generate package dataset and documentation
        run: |
          Rscript data-raw/continuous_outcomes_steps.R
          Rscript -e 'roxygen2::roxygenise()'
          test -f data/continuous_outcomes_steps.rda
          test -f man/continuous_outcomes_steps.Rd
          grep -q 'continuous_outcomes_steps' man/create_reals_distribution_steps.Rd
      - name: Commit generated artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/continuous_outcomes_steps.rda man/continuous_outcomes_steps.Rd man/create_reals_distribution_steps.Rd
          git commit -m 'docs: generate packaged continuous outcomes dataset and Rd files'
          git push origin HEAD:docs/reproducible-continuous-steps-example

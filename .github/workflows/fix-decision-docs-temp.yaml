name: Fix Decision Curve docs temporary

on:
  push:
    branches:
      - feat/static-decision-curve-browser-v2
    paths:
      - '.github/workflows/fix-decision-docs-temp.yaml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/static-decision-curve-browser-v2
      - name: Apply documentation fix
        run: python3 .github/fix_decision_docs.py
      - name: Commit documentation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/decision.R .github/fix_decision_docs.py
          git commit -m "Fix Decision Curve parameter documentation"
          git push origin HEAD:feat/static-decision-curve-browser-v2

name: Vendor rtichoke_viz v0.5.0 archive (temporary)

on:
  push:
    branches:
      - feature/browser-report-viz-0.5.0

permissions:
  contents: write

jobs:
  vendor-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/browser-report-viz-0.5.0
      - name: Download and force-add exact release archive
        run: |
          set -euo pipefail
          url="https://github.com/uriahf/rtichoke_viz/releases/download/v0.5.0/rtichoke-viz-0.5.0.tar.gz"
          curl -fL "$url" -o inst/rtichoke-viz/rtichoke-viz-0.5.0.tar.gz
          actual="$(sha256sum inst/rtichoke-viz/rtichoke-viz-0.5.0.tar.gz | awk '{print $1}')"
          test "$actual" = "ab36ae71f9090b4de62da8f552ebe84ac35885ab04958667faaf070db2c98f65"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f inst/rtichoke-viz/rtichoke-viz-0.5.0.tar.gz
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Track rtichoke_viz v0.5.0 release archive"
          git push origin HEAD:feature/browser-report-viz-0.5.0

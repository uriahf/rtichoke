name: Temporary Air formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/browser-lift-v0.4.0
          fetch-depth: 0
      - uses: posit-dev/setup-air@v1
        with:
          version: "0.11.0"
      - name: Format changed R files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.R' | while IFS= read -r file; do
            air format "$file"
          done
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add R tests tools
          if git diff --cached --quiet; then
            echo 'No formatting changes'
          else
            git commit -m 'Format browser Lift integration with Air'
            git push origin HEAD:feat/browser-lift-v0.4.0
          fi

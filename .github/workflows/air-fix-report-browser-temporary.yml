name: Air-fix report browser test (temporary)

on:
  push:
    branches:
      - feature/browser-report-viz-0.5.0

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/browser-report-viz-0.5.0
      - uses: posit-dev/setup-air@v1
        with:
          version: 0.11.0
      - name: Format and commit
        run: |
          set -euo pipefail
          air format tests/testthat/test-report-browser.R
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/testthat/test-report-browser.R
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format browser report tests"
          git push origin HEAD:feature/browser-report-viz-0.5.0
